name: Release to Maven Central

# Публикация по тегу N.N.N. Версию берёт build.gradle.kts из GITHUB_REF_NAME.
#
# ## Почему ВСЁ на macOS-раннере
#
# Apple-таргеты (iOS, tvOS, watchOS, macOS) собираются только на маке.
# Linux-раннер их просто пропускает, и «зелёный» прогон там ничего не
# доказывает: половина заявленных таргетов не собирается вовсе, а их
# артефакты не публикуются.
#
# Мак — полноценный KMP-хост: linuxX64, linuxArm64, mingwX64, macosX64,
# macosArm64 компилируются на нём так же, как на ubuntu (klib
# хост-независим). Android-таргеты тоже работают — kn-clang тянет bionic
# toolchain в KONAN_DATA_DIR сам.
#
# Поэтому одна джоба на macos-arm64 собирает и публикует ВСЁ: 20
# таргетов, включая Apple, в одном прогоне.
#
# ## Что НЕ запускается на маке
#
# linuxX64Test, linuxArm64Test, mingwX64Test: бинарник линкуется, но под
# чужую платформу не исполняется. Для них только компиляция.
# macosX64Test не запускаем — Rosetta под вопросом, только компиляция.
#
# ## Питфоллы мака
#
#  - нет node: `actions/checkout` падает с «Cannot find: node in PATH»,
#    поэтому checkout делается шеллом.
#  - нет Docker: контейнерные шаги недоступны.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: macos-latest

    steps:
      # actions/checkout на маке требует node, которого в образе нет.
      # Шелл-вариант делает то же самое: fetch нужного рефа и checkout.
      - name: Checkout (shell — на маке нет node)
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin \
            "https://x-access-token:${{ github.token }}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.ref_name }}"
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: liberica

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # AAR собирается через com.android.library: нужны platform jar и
      # build-tools. NDK не нужен — kn-clang качает свой bionic сам.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # DuckDB как разделяемая библиотека: исполняемая на маке сборка.
      # Тесты без неё падают (и это правильно — иначе ворота фиктивны).
      - name: Download DuckDB shared library (macOS arm64)
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ vars.DUCKDB_VERSION }}"
          VER="${VER:-v2.0.1}"
          # 🔴 НЕ /opt: на macOS-раннере /opt принадлежит root, а джоба идёт
          # под пользователем runner — `mkdir -p /opt/duckdb` падает с
          # Permission denied. На Linux /opt доступен, поэтому локально
          # работало, а на маке — нет.
          DIR="${RUNNER_TEMP:-/tmp}/duckdb"
          mkdir -p "$DIR"
          curl -sSL -o "$DIR/duckdb.tgz" \
            "https://github.com/duckdb/duckdb/releases/download/${VER}/duckdb-shared-libs-osx-arm64.tar.gz"
          tar xzf "$DIR/duckdb.tgz" -C "$DIR"
          test -f "$DIR/libduckdb.dylib" || {
            echo "::error::libduckdb.dylib не распаковалась в $DIR"; ls -la "$DIR"; exit 1; }
          file "$DIR/libduckdb.dylib"
          echo "DUCKDB_LIBRARY=$DIR/libduckdb.dylib" >> "$GITHUB_ENV"

      # Кросс-JNI заголовки — ДО первого gradlew.
      #
      # kn-clang решает, доступен ли jni_md.h, на этапе КОНФИГУРАЦИИ
      # (isUsable внутри clangBuildJni), а не при выполнении задачи. Поэтому
      # Gradle-задача провижна опаздывает и кросс-таргет получает SKIPPED —
      # в jar остаётся один срез. macOS-JDK не несёт include/linux и
      # include/win32, так что без этого шага linux- и mingw-библиотеки
      # молча пропадают из jar.
      - name: Provision cross JNI headers (linux/win32 jni_md.h)
        shell: bash
        run: |
          set -euo pipefail
          # Путь обязан совпадать с тем, что прописан в duckdb-core/build.gradle.kts:
          # layout.buildDirectory.dir("jni-include") — это build/ МОДУЛЯ, не корня.
          # Разойдись они — файлы скачаются, а плагин их не увидит.
          D=duckdb-core/build/jni-include
          mkdir -p "$D/linux" "$D/win32"
          curl -fsSL https://raw.githubusercontent.com/openjdk/jdk21u/master/src/java.base/unix/native/include/jni_md.h \
            -o "$D/linux/jni_md.h"
          curl -fsSL https://raw.githubusercontent.com/openjdk/jdk21u/master/src/java.base/windows/native/include/jni_md.h \
            -o "$D/win32/jni_md.h"
          ls -l "$D"/*/jni_md.h

      - name: Import GPG key
        shell: bash
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSWORD }}
        run: |
          set -euo pipefail
          command -v gpg >/dev/null 2>&1 || brew install gnupg
          # Каталог обязан существовать ДО правки конфигов: на свежем раннере
          # gpg создаёт его только при первом импорте, и запись
          # gpg-agent.conf упадёт с «No such file or directory».
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --reload gpg-agent
          # Пустой --passphrase "" gpg loopback не принимает — ветка else.
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            printf '%b' "$GPG_KEY" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" --import
          else
            printf '%b' "$GPG_KEY" | gpg --batch --yes --pinentry-mode loopback --import
          fi
          gpg --list-secret-keys --with-colons | grep -q '^sec' && echo "GPG key imported"

      # Прогрев Apple-sysroot'ов ДО публикации.
      #
      # 🔴 kn-clang собирает C-шов напрямую через clang, а не через K/N, и
      # поэтому установку xcode-sysroot не триггерит. Если такая сборка
      # стартует параллельно с установкой sysroot, clang не находит
      # заголовки:
      #
      #   ddbt_shim.c:25:10: fatal error: 'stdio.h' file not found
      #   1 error generated.
      #   > Task :duckdb-core:buildStaticDdbt_shimWatchosDeviceArm64 FAILED
      #
      # Проверено на релизе 0.1.0: все Apple-таргеты собрались, упал
      # ровно watchosDeviceArm64 — первый, кому «повезло» стартовать во
      # время установки.
      #
      # Поэтому sysroot'ы ставим заранее, отдельным шагом: компилируем
      # пустую библиотеку под каждый watchOS-таргет, это тянет sysroot.
      - name: Pre-warm watchOS sysroots
        shell: bash
        run: |
          # Прогрев идёт через Gradle, а не через прямой kotlinc-native:
          # Gradle сам находит prebuilt, а падение прогрева не должно
          # валить всю джобу — это оптимизация, а не ворота.
          set -uo pipefail
          for t in WatchosArm64 WatchosSimulatorArm64 WatchosX64 WatchosArm32; do
            echo "--- pre-warm $t"
            ./gradlew ":duckdb-core:compileKotlin$t" --no-daemon || echo "  (прогрев $t не удался, продолжаю)"
          done
          echo "=== sysroot:"
          ls "$HOME/.konan/dependencies" 2>/dev/null | grep -iE 'watchos|xcode' || echo "(xcode-sysroot не найден)"

      # --- Ворота 1: тесты. На маке исполняются macosArm64Test и jvmTest.
      - name: Test (JVM + macOS arm64)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :duckdb-core:jvmTest \
                    :duckdb-core:macosArm64Test \
                    :duckdb-kdatabase:jvmTest \
                    :duckdb-korm:jvmTest \
                    --no-daemon

          echo "=== сводка по отчётам ==="
          python3 - <<'PY'
          import glob, re, sys
          total = bad = 0
          for f in glob.glob('*/build/test-results/*/TEST-*.xml'):
              d = open(f).read()
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', d)
              if not m:
                  continue
              t, s, fa, e = map(int, m.groups())
              total += t; bad += fa + e
              print(f"{f}: tests={t} skipped={s} fail={fa} err={e}")
          print(f"ИТОГО: {total} тестов, {bad} падений")
          if total == 0:
              print("::error::не найдено ни одного теста — ворота фиктивны")
              sys.exit(1)
          if bad:
              print("::error::есть падающие тесты")
              sys.exit(1)
          PY

      # --- Ворота 2: компиляция всех не-macOS таргетов.
      - name: Compile all non-Apple-host targets
        shell: bash
        run: |
          ./gradlew :duckdb-core:compileKotlinLinuxX64 \
                    :duckdb-core:compileKotlinLinuxArm64 \
                    :duckdb-core:compileKotlinMingwX64 \
                    :duckdb-core:compileKotlinAndroidNativeArm32 \
                    :duckdb-core:compileKotlinAndroidNativeArm64 \
                    :duckdb-core:compileKotlinAndroidNativeX86 \
                    :duckdb-core:compileKotlinAndroidNativeX64 \
                    :duckdb-core:compileKotlinIosArm64 \
                    :duckdb-core:compileKotlinIosSimulatorArm64 \
                    :duckdb-core:compileKotlinIosX64 \
                    :duckdb-core:compileKotlinTvosArm64 \
                    :duckdb-core:compileKotlinTvosSimulatorArm64 \
                    :duckdb-core:compileKotlinWatchosArm64 \
                    :duckdb-core:compileKotlinWatchosSimulatorArm64 \
                    --no-daemon

      # --- Ворота 3: .so внутри JVM-jar и AAR с четырьмя ABI.
      - name: Verify JNI library inside jar and AAR
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :duckdb-core:jvmJar :duckdb-core:assembleRelease --no-daemon

          jar=$(ls duckdb-core/build/libs/duckdb-core-jvm-*.jar | head -1)
          echo "jar: $jar"
          rm -rf /tmp/payload && mkdir -p /tmp/payload
          unzip -o -q "$jar" -d /tmp/payload
          fail=0
          # macOS-хост публикует ВСЕ срезы; linux/mingw собираются кроссом.
          for entry in \
            linux_x64/libduckdbk.so \
            linux_arm64/libduckdbk.so \
            mingw_x64/libduckdbk.dll \
            macos_arm64/libduckdbk.dylib
          do
            if [ ! -f "/tmp/payload/$entry" ]; then
              echo "::error::в jar нет $entry — кросс-сборка пропущена"
              fail=1
            fi
          done
          file /tmp/payload/linux_x64/libduckdbk.so   | grep -q 'ELF 64-bit'  || { echo "::error::linux_x64 не ELF"; fail=1; }
          file /tmp/payload/mingw_x64/libduckdbk.dll  | grep -qE 'PE32|MS Windows' || { echo "::error::mingw_x64 не PE"; fail=1; }
          file /tmp/payload/macos_arm64/libduckdbk.dylib | grep -q 'Mach-O'  || { echo "::error::macos_arm64 не Mach-O"; fail=1; }
          exit $fail

          aar=duckdb-core/build/outputs/aar/duckdb-core-release.aar
          unzip -l "$aar" | grep -E 'jni/(arm64-v8a|armeabi-v7a|x86|x86_64)/libduckdbk\.so'
          count=$(unzip -l "$aar" | grep -c 'jni/.*/libduckdbk\.so')
          test "$count" -eq 4 \
            || { echo "::error::ожидалось 4 нативных библиотеки в AAR, найдено $count"; exit 1; }

      - name: Publish to Maven Central
        shell: bash
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: |
          ./gradlew publishToMavenCentral \
            -Pversion=${{ github.ref_name }} \
            -PsigningUseGpg=true \
            -Psigning.gnupg.keyName="$GPG_KEY_ID" \
            -Psigning.gnupg.passphrase="$GPG_PASSWORD" \
            -PmavenCentralUsername=${{ secrets.CENTRAL_USERNAME }} \
            -PmavenCentralPassword=${{ secrets.CENTRAL_PASSWORD }}

      # Central асинхронен: после BUILD SUCCESSFUL артефакт висит в состоянии
      # PUBLISHING 15-30 минут и на repo1.maven.org отдаёт 404. Ждём появления
      # POM, иначе следующий релиз в цепочке (например korm после kdatabase)
      # упадёт на резолве. Проверено на живой цепочке kdatabase -> korm.
      - name: Wait for artifacts to appear on Maven Central
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          fail=0
          for artifact in duckdb-core duckdb-kdatabase duckdb-korm; do
            ok=0
            for i in $(seq 1 60); do
              code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' \
                "https://repo1.maven.org/maven2/pw/binom/db/${artifact}/${VERSION}/${artifact}-${VERSION}.pom" || echo 000)
              if [ "$code" = "200" ]; then
                echo "OK   ${artifact}:${VERSION} ($((i*30))s)"
                ok=1; break
              fi
              sleep 30
            done
            if [ "$ok" = "0" ]; then
              echo "::error::${artifact}:${VERSION} не появился в Central за 30 минут"
              fail=1
            fi
          done
          exit $fail
