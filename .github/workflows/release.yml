name: Release to Maven Central

# Тег вида N.N.N запускает публикацию. Версию берём из имени тега:
# build.gradle.kts читает GITHUB_REF_NAME, а в локальной сборке версия
# остаётся SNAPSHOT.
#
# ## Почему перед публикацией скачивается DuckDB
#
# Тесты требуют живую libduckdb.so: без неё они падают с внятным
# сообщением, а не «проходят» пустыми. Скачиваем официальный shared
# release и подсовываем через DUCKDB_LIBRARY.
#
# ## Что публикуется
#
# JVM, Android (AAR, 4 ABI), Android NDK ×4, Linux ×2, MinGW.
# Apple-таргеты объявлены в build.gradle.kts, но на Linux-хосте отключены
# плагином; их klib собираются на маке отдельной джобой (см. build-apple).
#
# ## Ворота
#
# Публикация не начинается, пока не прошли:
#  1. тесты на JVM и linuxX64 (с живой библиотекой);
#  2. проверка, что .so лежит в JVM-jar;
#  3. проверка, что AAR несёт все четыре ABI.
# Всё это — не формальность: каждый пункт ловил реальную поломку.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: liberica

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # AAR собирается через com.android.library: нужны platform jar и
      # build-tools. NDK сюда НЕ нужен — kn-clang скачивает свой bionic
      # toolchain в KONAN_DATA_DIR сам.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang mingw-w64

      - name: Download DuckDB shared library
        run: |
          set -euo pipefail
          VER="${{ vars.DUCKDB_VERSION }}"
          VER="${VER:-v2.0.1}"
          curl -sSL -o duckdb.tgz \
            "https://github.com/duckdb/duckdb/releases/download/${VER}/duckdb-shared-libs-linux-amd64.tar.gz"
          mkdir -p /opt/duckdb
          tar xzf duckdb.tgz -C /opt/duckdb
          test -f /opt/duckdb/libduckdb.so || { echo "::error::libduckdb.so не распаковалась"; exit 1; }
          echo "DUCKDB_LIBRARY=/opt/duckdb/libduckdb.so" >> "$GITHUB_ENV"

      # --- Ворота 1: тесты. Без живой библиотеки они падают, а не зеленеют.
      - name: Test (JVM + native)
        run: |
          ./gradlew :duckdb-core:jvmTest \
                    :duckdb-core:linuxX64Test \
                    :duckdb-kdatabase:jvmTest \
                    :duckdb-korm:jvmTest \
                    --no-daemon
          echo "=== сводка по отчётам ==="
          python3 - <<'PY'
          import glob, re, sys
          total = bad = 0
          for f in glob.glob('*/build/test-results/*/TEST-*.xml'):
              d = open(f).read()
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', d)
              if not m:
                  continue
              t, s, fa, e = map(int, m.groups())
              total += t; bad += fa + e
              print(f"{f}: tests={t} skipped={s} fail={fa} err={e}")
          print(f"ИТОГО: {total} тестов, {bad} падений")
          if total == 0:
              print("::error::не найдено ни одного теста — ворота фиктивны")
              sys.exit(1)
          if bad:
              print("::error::есть падающие тесты")
              sys.exit(1)
          PY

      # --- Ворота 2: нативная библиотека внутри JVM-jar.
      - name: Verify JNI library is inside the jar
        run: |
          ./gradlew :duckdb-core:jvmJar --no-daemon
          jar=$(ls duckdb-core/build/libs/duckdb-core-jvm-*.jar | head -1)
          echo "jar: $jar"
          unzip -l "$jar" | grep -E 'linux_x64/libduckdbk\.so' \
            || { echo "::error::в jar нет JNI-библиотеки"; exit 1; }

      # --- Ворота 3: AAR несёт все четыре ABI. Без этого Android-потребитель
      # получит AAR без .so и упадёт на UnsatisfiedLinkError в рантайме.
      - name: Verify Android AAR carries all four ABIs
        run: |
          ./gradlew :duckdb-core:assembleRelease --no-daemon
          aar=duckdb-core/build/outputs/aar/duckdb-core-release.aar
          test -f "$aar" || { echo "::error::AAR не собрался"; exit 1; }
          unzip -l "$aar" | grep -E 'jni/(arm64-v8a|armeabi-v7a|x86|x86_64)/libduckdbk\.so'
          count=$(unzip -l "$aar" | grep -c 'jni/.*/libduckdbk\.so')
          test "$count" -eq 4 || { echo "::error::ожидалось 4 нативных библиотеки в AAR, найдено $count"; exit 1; }

      - name: Publish to Maven Central
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: |
          ./gradlew publishToMavenCentral \
            -Pversion=${{ github.ref_name }} \
            -PsigningUseGpg=true \
            -Psigning.gnupg.keyName="$GPG_KEY_ID" \
            -Psigning.gnupg.passphrase="$GPG_PASSWORD" \
            -PmavenCentralUsername=${{ secrets.CENTRAL_USENAME }} \
            -PmavenCentralPassword=${{ secrets.CENTRAL_PASSWORD }}

  # Apple-klib собираются только на macOS-хосте. Отдельная джоба, потому что
  # Linux-раннер эти таргеты просто пропускает — и «зелёный» прогон там
  # ничего не доказывает. Эта джоба компилирует и запускает тесты на маке.
  build-apple:
    runs-on: macos-arm64
    if: vars.APPLE_RUNNER_ENABLED == 'true'

    steps:
      - name: Checkout (shell — на маке нет node для actions/checkout)
        shell: bash
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.ref_name }}"
          git checkout -q FETCH_HEAD

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: liberica

      - name: Download DuckDB shared library (macOS)
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ vars.DUCKDB_VERSION }}"
          VER="${VER:-v2.0.1}"
          curl -sSL -o duckdb.tgz \
            "https://github.com/duckdb/duckdb/releases/download/${VER}/duckdb-shared-libs-osx-arm64.tar.gz"
          mkdir -p /opt/duckdb
          tar xzf duckdb.tgz -C /opt/duckdb
          test -f /opt/duckdb/libduckdb.dylib
          echo "DUCKDB_LIBRARY=/opt/duckdb/libduckdb.dylib" >> "$GITHUB_ENV"

      # Apple-таргеты: macosX64Test не запускаем (Rosetta под вопросом),
      # linux/mingw-тесты на маке не исполняются — только компиляция.
      - name: Test Apple targets
        shell: bash
        run: |
          ./gradlew :duckdb-core:macosArm64Test \
                    :compileTestKotlinMacosX64 \
                    :compileKotlinLinuxX64 \
                    :compileKotlinLinuxArm64 \
                    :compileKotlinMingwX64 \
                    --no-daemon
