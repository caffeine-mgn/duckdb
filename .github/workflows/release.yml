name: Release to Maven Central

# Тег вида N.N.N запускает публикацию. Версию берём из имени тега:
# build.gradle.kts читает GITHUB_REF_NAME, а в локальной сборке версия
# остаётся SNAPSHOT.
#
# ## Почему перед публикацией скачивается DuckDB
#
# Тесты требуют живую libduckdb.so: без неё они падают с внятным
# сообщением, а не «проходят» пустыми. Скачиваем официальный shared
# release и подсовываем через DUCKDB_LIBRARY.
#
# ## Что публикуется с этой джобы
#
# JVM + Linux + MinGW. Apple-таргеты KMP объявлены, но на Linux-хосте
# отключены плагином; их klib собираются на маке (отдельная джоба, когда
# понадобится).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: liberica

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang mingw-w64

      - name: Download DuckDB shared library
        run: |
          set -euo pipefail
          VER="${{ vars.DUCKDB_VERSION }}"
          VER="${VER:-v2.0.1}"
          curl -sSL -o duckdb.tgz \
            "https://github.com/duckdb/duckdb/releases/download/${VER}/duckdb-shared-libs-linux-amd64.tar.gz"
          mkdir -p /opt/duckdb
          tar xzf duckdb.tgz -C /opt/duckdb
          test -f /opt/duckdb/libduckdb.so
          echo "DUCKDB_LIBRARY=/opt/duckdb/libduckdb.so" >> "$GITHUB_ENV"
          /opt/duckdb/libduckdb.so >/dev/null 2>&1 || true   # просто проверка, что файл исполним

      # Ворота: тесты гоняются ДО публикации. Зелёный прогон без живой
      # библиотеки ничего не доказывает, поэтому шаг выше обязателен.
      - name: Test (JVM + native)
        run: |
          ./gradlew :duckdb-core:jvmTest \
                    :duckdb-core:linuxX64Test \
                    :duckdb-kdatabase:jvmTest \
                    :duckdb-korm:jvmTest \
                    --no-daemon

      - name: Verify JNI library is inside the jar
        run: |
          ./gradlew :duckdb-core:jvmJar --no-daemon
          jar=$(ls duckdb-core/build/libs/duckdb-core-jvm-*.jar | head -1)
          unzip -l "$jar" | grep -E 'linux_x64/libduckdbk\.so' \
            || { echo "::error::в jar нет JNI-библиотеки"; exit 1; }

      - name: Publish to Maven Central
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: |
          ./gradlew publishToMavenCentral \
            -Pversion=${{ github.ref_name }} \
            -PsigningUseGpg=true \
            -Psigning.gnupg.keyName="$GPG_KEY_ID" \
            -Psigning.gnupg.passphrase="$GPG_PASSWORD" \
            -PmavenCentralUsername=${{ secrets.CENTRAL_USENAME }} \
            -PmavenCentralPassword=${{ secrets.CENTRAL_PASSWORD }}
