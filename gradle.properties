# Kotlin/Native: не спамить предупреждениями об отключённых на этом хосте
# таргетах (Apple собираются только на macOS).
kotlin.native.ignoreDisabledTargets=true

# Общий cinterop для всех native-таргетов: один def-файл на иерархию вместо
# отдельной генерации на каждый таргет.
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.enableCInteropCommonization.nowarn=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
